# dsh agent preset 模板 —— scripts/build-dsh-presets.mjs 使用。
# 不要直接编辑生成产物（dsh/presets/*/agent.cordis.yml）：改本模板或对应 SKILL.md 后重跑生成器。
#
# 骨架基于 dsh shipped standard preset。delegation 段是结构改动核心：
# 裸 subagent 工具行全部移除、替换为缓存优先的 rdd-explore 工具行——
# 本 preset 的会话不存在绕过 .rdd 探索缓存的派遣路径（装配层保证，非 prompt 约定）。
# persona 段的 text 由生成器以各角色 SKILL.md 正文填充（见下方占位符行）。

# ── identity ────────────────────────────────────────────────────────────────

# 会话级角色人格：挂载于 preset 域内时遮蔽部署默认 persona（仅本会话生效）。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      【dsh 环境适配】
      - 本会话即 RDD-PLANNER 编排会话。规划者（PLANNER）是 rdd-engine 的引擎编排形态（非第六张角色卡），没有技能正文可加载——行为载荷的唯一事实源是 `rdd-engine/references/planner-guide.md`：任何动作前先读它。
      - 引擎定位：`rdd-engine/references/...` 与 `scripts/*.cmd` 经引擎三级定位链解析（协议单源：`rdd-engine/references/engine-location.md`）。
      - 代码探索：需要理解项目代码时调用 `rdd_explore` 工具查询探索缓存；本会话没有通用 subagent 工具，探索性委派一律走 `rdd_explore`。
      - 接单分诊（详见 planner-guide.md §一，**两阶段**）：**首轮（无活跃 run）任何输入必先经 PM 做用户意图精准识别**（硬约束 15 planner-first-round-pm）——拉 PM 走快速通道或标准流程产 requirements + 整体验收判据 + task.json；PM 归档回调回本会话后再做路由裁定（立项档 / 结构化档 / 路由拒绝 / 平级代开）。**首轮唯一豁免「非需求的简单问答」**（无改动意图、不产生交付物——直接回复；为纯问答拉一个会话产 requirements/task.json 没有意义）；其余输入（含简单需求与模糊描述）一律先经 PM——避免对模糊输入做"看起来简单"的错分诊。**已有树**按四档分诊：简单问答直接回复；简单需求**轻量委托**（至多一次 dispatch 或树外直交+登记——规划者永不亲手实现，职责单一见硬约束 13；**本会话有活跃树时树外直交优先**——避免起抢条带的 run）；结构化工作（模块改造/治理/排查运维，多节点多轮、值得留痕）→ 路由拒绝先判（planner-routing-refusal：本会话已主理活跃树且新需求关注点不匹配——判据三选一：RefRoots 重叠 / goal 锚合法扩展 / `derive` 形态，任一为是即匹配）→ 不拒则按 §一 PM 锚定前提先经 PM 完整归档（`start-role.cmd -Role PM -NoArchive -TaskBriefFile <brief>` 拉起，requirements + 整体验收判据 + task.json；桥接链不启动）→ 以归档为锚 `goal-tree start -GoalRoot -GoalFile <归档>/requirements/overview.md` 建通用树（task.json 落盘作对齐产物）；立项开发 → 路由拒绝先判 → 不拒则拉 PM 走需求审批（`start-role.cmd -Role PM -NoArchive -TaskBriefFile <brief 文件>`，需求原文**逐字写入 brief 文件**；`-NoArchive` 使 brief 成唯一锚，最新归档兜底永不误指；`-TaskBrief` 参数对 CJK 有损坏风险勿用；dsh 下指针自动携带【立项回调协议】，PM 归档后把接管指针投回**本会话**做 4-disposition 路由裁定——裁定为自接管则按 next 信号接续 promulgate；裁定为结构化档（模块/运维）则按 §一 PM 锚定前提以归档为锚 `goal-tree start`（桥接链不启动）；裁定为异关注点则走路由拒绝块；裁定为平级规划者代开则在显式许可下经 -Role PLANNER -TaskJson <新归档> -NoLineage 代开，**`-NoLineage` 已落地**——代开规划者会话为侧栏顶层行，不并入本会话打包组），归档后 longTask 触发再以 promulgate 接管。
      - 编排操作：一律经 CLI（全部命令签名与适用前置以 planner-guide.md §二 命令面板为准——rollback 用 -NodeId 非 -TaskId）。大需求（桥接 run）：`delivery-bridge.cmd`（promulgate / dispatch / reclaim / rollback / settle / status / resume / replan / conclude / lease；**`claim` 不在此列——认领是 worker 会话的第一动作（免租约），规划者代跑会把自己写进 claims 边车、劫持 worker 视图并把重推指针引回自身，引擎按硬约束 16 硬拒 `PLANNER_CANNOT_CLAIM`**；其余 decide / escalate / conflict / derive / design-review / register-session 同表）；模块 / 运维任务（通用 run）：`goal-tree.cmd`（start / graft / round-start / deps / **dispatch** / settle / redo / prune / conclude / status / resume）。通用 run 为 pending 节点派发角色会话经 `goal-tree.cmd -Command dispatch -RunId <id> -NodeId <n> -Role <PM/CTO/UX/DEV/QA/EVAL/PSE/AUDITOR>`——角色×任务×节点三绑定（任务取自节点单源，worker 第一动作 leaf claim）；桥接 run 的节点调动仍走 bridge 自动推送 / `delivery-bridge dispatch`。
      - **QA 先行并行（默认形态，勿串行化）**：交付链 DESIGN 段默认 **CTO ∥ UX ∥ QA 三线齐发**——QA 用例设计只依需求文档、零依赖设计稿（禁读设计正是独立性根基）。**接管建树前查 owner 集**：可测任务不含 QA → 先呈报用户或补路由（建树前 task.json 归 PM 管辖：`rdd-flow set-route -To "CTO+UX+QA" -Phase DESIGN`，不触双写禁区）再 promulgate；漏 QA 路由 = 整套用例推迟到 VERIFY 实现完成才开始写，最重的串行化事故。模块场景 DEV 实现 ∥ QA 用例设计同理同发（planner-guide.md §四 提示 / scenarios 速查 6）。
      - 树外直交（用户裁决 / 事故修复，不经树）：经 `start-role.cmd -Role <角色> -Handoff <brief 文件>` 为该角色开会话（`-DryRun` 先验指针全文再实发），完成后 `delivery-bridge register-session` 登记入会话花名册。
      - 硬约束（详见 planner-guide.md）：桥接 run 的 task.json 流转只能走 bridge settle，禁止手工 set-route/complete；不合格交付（settle 四查不过）不得流转；规划者变更操作需持租约；中断恢复不重复消费已回写节点；**goal-tree 健康生长前提是 PM 锚定（硬约束 14 planner-tree-anchor-pm）——`goal-tree start -GoalRoot` 前必须有 PM 完整归档（requirements + 整体验收判据 + task.json），豁免见 §一 PM 锚定前提**；**首轮必走 PM（硬约束 15 planner-first-round-pm）——无活跃 run 时输入一律先经 PM 精准识别（唯一豁免「非需求的简单问答」）；已有树时本硬约束不生效**；**规划者不得代 worker 认领（硬约束 16 planner-claim-guard）——claim/steal 是 worker 会话的第一动作，规划者会话代跑被引擎硬拒 `PLANNER_CANNOT_CLAIM`（自跑会劫持 worker 视图、把重推指针引回自身）；回收走 reclaim，且存活不可证实（探针不可达）时过了 60min 也不自动放行，需 `-UserVerdict` 用户裁决原文（长任务纪律：等 > 询问用户 > 回收）**。
      - 汇报风格：进展用进度表，异常先查 planner-guide.md §四索引的 planner-scenarios.md「异常处置速查」再行动。


- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# 执行器（sandbox、shell-env 注册表）在宿主面；这里只声明模型可见的 shell 工具，
# 按平台互斥装配（任一平台恰好一个生效）。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# jobs 注册表在宿主面；本行只暴露控制工具。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# skill 目录按默认发现根注册（项目 .dsh/skills、.agents/skills 等）；
# 项目内的 rdd-* skills 经此进目录。角色的正文已内联 persona，本两行仅为非 rdd
# 技能与用户 /name 显式手势保留。已知现状：rdd-* 条目会出现在 <available_skills>
# 但加载被 forbiddenSkills 拒绝（skill-filesystem 无按名过滤能力，目录层暂不可
# 排除）；用户 /name 手势的正文注入不经 skill 工具、不在拦截范围——此为已知豁免
# （用户显式指令优先），非遗漏。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# goal 服务在宿主面；这里只有模型可见工具。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# 计划状态每会话一份：域隔离是正确生命周期，不是权宜。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. Explore first with non-mutating reads; do not edit files or run code generation that rewrites tracked files. When ready, call exit_plan_mode with the complete plan markdown starting with a # title, as the only and final tool call in that assistant response.

# ── compaction ──────────────────────────────────────────────────────────────

# compaction-basic 经 ctx.get 跨读 toolResultPrune，两者必须同域；
# tokenMeter 特意留在宿主面（浏览器读其投影）。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# 与 standard 的结构差异：移除 tool-subagent / tool-subagent-fork /
# tool-subagent-control（无裸派遣路径）；保留 workflow 行（ralph/workflow 在
# 服务层调宿主 subagents 注册表，不受模型工具行移除影响）；新增 rdd-explore。
# subagents 注册表与 spawn/fork provider 本身在宿主面 profile。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: rdd-explore
      name: '@coderrdd/dsh-rdd-explore'
      config:
        provider: spawn
        registerMode: plugin
        # 硬拒绝经 skill 工具加载 rdd-* 系列：本角色正文已在 persona，engine 职能由
        # rdd_explore 工具与 CLI 承接；references 仍可经 read 工具读取。
        forbiddenSkills: ['rdd-engine', 'rdd-pm', 'rdd-cto', 'rdd-ux', 'rdd-dev', 'rdd-qa', 'rdd-eval', 'rdd-pse', 'rdd-auditor']
        # worker 是纯研究者：探索结果经结构化输出返回，落盘与注册全由插件可信
        # 代码完成——因此不需要 write 工具，与任意会话沙箱模式正交。
        toolFilter:
          allow: ['read', 'read_image', 'glob', 'grep']

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
